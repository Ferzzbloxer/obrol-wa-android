name: Build Android APK

on:
  push:
    branches: [ "android" ]
  pull_request:
    branches: [ "android" ]
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: core/go.sum

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Locate Pre-installed NDK & Build Go Mobile AAR
      - name: Build Go Mobile AAR
        run: |
          # Install Go mobile tools
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin

          gomobile init

          # Detect the pre-installed Android NDK on GitHub's runner
          export ANDROID_NDK_HOME=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android NDK located at: $ANDROID_NDK_HOME"

          # Prepare output folder
          mkdir -p android/app/libs

          # Compile the .aar
          cd core
          go mod tidy
          gomobile bind -target=android -androidapi 26 -o ../android/app/libs/obrolcore.aar .
          cd ..

      # 4. Build Android APK with Gradle
      - name: Build Android APK
        run: |
          cd android
          # Create Gradle wrapper if not present
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      # 5. Upload APK as Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obrol-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # 6. Upload AAR as backup
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: obrolcore-aar
          path: android/app/libs/obrolcore.aar
          retention-days: 7
