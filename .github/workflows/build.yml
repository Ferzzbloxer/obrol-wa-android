name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: core/go.sum

      # 2. Setup Java for Android Gradle
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android SDK & NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      # 4. Install gomobile & compile obrolcore.aar
      - name: Build Go Mobile AAR
        run: |
          # Install Go mobile tooling
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # Initialize gomobile
          gomobile init
          
          # Set NDK path
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          
          # Create target libs directory
          mkdir -p android/app/libs
          
          # Build .aar
          cd core
          go mod tidy
          gomobile bind -target=android -androidapi 26 -o ../android/app/libs/obrolcore.aar .
          cd ..

      # 5. Build Android APK
      - name: Build Android APK with Gradle
        run: |
          cd android
          # Generate Gradle wrapper if not checked into Git
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      # 6. Upload APK as Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obrol-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # 7. (Optional) Upload AAR as backup
      - name: Upload AAR Core
        uses: actions/upload-artifact@v4
        with:
          name: obrolcore-aar
          path: android/app/libs/obrolcore.aar
          retention-days: 7