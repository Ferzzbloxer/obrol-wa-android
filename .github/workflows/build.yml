name: Build Android APK

on:
  push:
    branches: [ "android" ]
  pull_request:
    branches: [ "android" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Compile Go Mobile AAR
      - name: Build Go Mobile AAR
        run: |
          # Install Go mobile tools globally
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

          # Select a stable pre-installed NDK (NDK 26 or 25 instead of 30)
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          else
            export ANDROID_NDK_HOME=$(find $ANDROID_HOME/ndk -maxdepth 1 -name "26.*" -o -name "25.*" | sort -V | tail -n 1)
          fi
          echo "Using stable Android NDK: $ANDROID_NDK_HOME"

          # Prepare output folder
          mkdir -p android/app/libs

          # Ensure mobile dependency is locked into the module
          cd core
          go get go.mau.fi/whatsmeow@latest
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind || true
          go mod tidy

          # Compile the .aar
          gomobile bind -target=android -androidapi 26 -o ../android/app/libs/obrolcore.aar .
          cd ..

      # 4. Build Android APK with Gradle
      - name: Build Android APK with Gradle
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      # 5. Upload APK as Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obrol-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # 6. Upload AAR as backup
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: obrolcore-aar
          path: android/app/libs/obrolcore.aar
          retention-days: 7
